plugins:
  enabled: true
  dir: "plugins"
  store-sources:
    - "https://raw.githubusercontent.com/ArchmageTony/cpa-resin-sticky-bind/main/registry.json"
  configs:
    cpa-resin-sticky-bind:
      enabled: true
      account_strategy: "auth_id"
      account_prefix: ""
      sync_interval_seconds: 30
      only_if_empty: true
      overwrite_existing: false
      rebind_on_change: false
      include_providers: []
      exclude_providers: []
      # Per-credential-type proxy entries (the management page writes here).
      # Entries containing {account} are sticky: the placeholder is replaced
      # per credential with the account from account_strategy. Entries
      # without {account} are used verbatim and shared by the whole type,
      # so Resin and plain vendor proxies can be mixed freely.
      # proxy_by_type:
      #   codex: "socks5h://<platform>.{account}:<token>@resin:2260"
      #   antigravity: "http://<user>:<pass>@<proxy-host>:<port>"
      # Global fallback for credential types without a dedicated entry.
      # other_proxy_url: "socks5h://<platform>.{account}:<token>@resin:2260"
      # Deprecated legacy chain, only used when other_proxy_url is empty.
      # resin_proxy_url: "socks5h://resin:2260"
      # proxy_token_env: "RESIN_PROXY_TOKEN"
      # default_platform: "default"
      # platform_by_provider: {}
      # platform_by_auth_id: {}
